services:
  - type: web
    name: creator-partnerships-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn -w 4 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        scope: run
        value: ${GOOGLE_SERVICE_ACCOUNT_KEY}
      - key: FLASK_ENV
        scope: run
        value: production
